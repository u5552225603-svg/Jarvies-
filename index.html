<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jarvis</title>
<style>
  :root {
    --margen-inferior: 16px;
  }

  * { box-sizing: border-box; }

  html {
    height: 100%;
    margin: 0;
    padding: 0;
    /* COLOR AZUL ESPACIAL */
    background: #0f172a;
  }

  body {
    height: var(--app-height, 100dvh);
    margin: 0;
    padding: 0;
    background: #0f172a;
    color: white;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #main-area {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 20px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #saludo {
    margin-top: 20vh;
    text-align: center;
    font-size: 26px;
    font-weight: 400;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    padding: 0 20px;
  }

  #messages {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .msg {
    padding: 14px 20px;
    border-radius: 20px;
    max-width: 85%;
    line-height: 1.6;
    font-size: 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease-out;
  }
  .user { background: #1e3a8a; margin-left: auto; border-bottom-right-radius: 4px; }
  .ai { background: #1f1f2e; border: 1px solid #2a2a3e; margin-right: auto; border-bottom-left-radius: 4px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #input-area {
    flex-shrink: 0;
    /* COLOR AZUL ESPACIAL TAMBIÉN EN LA BARRA */
    background: #0f172a;
    padding: 10px 15px calc(var(--margen-inferior) + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }

  .input-wrapper {
    width: 100%;
    max-width: 700px;
    display: flex;
    background: #1f1f2e;
    border-radius: 30px;
    padding: 5px 5px 5px 20px;
    border: 1px solid #2a2a3e;
    align-items: center;
  }

  input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: white;
    font-size: 16px;
    outline: none;
    padding: 10px 0;
  }

  button {
    background: #3b82f6;
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: 10px;
    transition: 0.2s;
    flex-shrink: 0;
  }
  button:active { background: #2563eb; transform: scale(0.95); }
  button svg { width: 20px; height: 20px; fill: white; }

  .typing {
    display: flex;
    gap: 5px;
    padding: 10px 15px;
    background: #1f1f2e;
    border-radius: 20px;
    width: fit-content;
    margin-right: auto;
    border: 1px solid #2a2a3e;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: #60a5fa;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
</style>
</head>
<body>

<div id="main-area">
  <div id="saludo">Buenas tardes, señor.</div>
  <div id="messages" style="display: none;"></div>
</div>

<div id="input-area">
  <div class="input-wrapper">
    <input id="input" placeholder="Pregunta lo que necesites..." autocomplete="off">
    <button onclick="enviar()" aria-label="Enviar">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const messages = document.getElementById("messages");
const saludo = document.getElementById("saludo");
const inputField = document.getElementById("input");
const mainArea = document.getElementById("main-area");
let historial = [];
let enviando = false;

function ajustarAltura() {
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-height', h + 'px');
  window.scrollTo(0, 0);
}
ajustarAltura();
window.addEventListener('resize', ajustarAltura);
window.addEventListener('orientationchange', ajustarAltura);
if (window.visualViewport) window.visualViewport.addEventListener('resize', ajustarAltura);

function actualizarSaludo() {
  const hora = new Date().getHours();
  let texto = "Buenas noches, señor.";
  if (hora >= 6 && hora < 12) texto = "Buenos días, señor.";
  else if (hora >= 12 && hora < 20) texto = "Buenas tardes, señor.";
  saludo.innerText = texto;
}
actualizarSaludo();

function bajar() {
  mainArea.scrollTop = mainArea.scrollHeight;
}

function añadirMensaje(clase, texto) {
  const div = document.createElement("div");
  div.className = "msg " + clase;
  div.textContent = texto;
  messages.appendChild(div);
  bajar();
  return div;
}

async function enviar() {
  const texto = inputField.value.trim();
  if (!texto || enviando) return;
  enviando = true;

  saludo.style.display = "none";
  messages.style.display = "flex";

  añadirMensaje("user", texto);
  inputField.value = "";
  historial.push({ role: 'user', content: texto });

  const typingIndicator = document.createElement("div");
  typingIndicator.className = "typing";
  typingIndicator.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
  messages.appendChild(typingIndicator);
  bajar();

  try {
    const respuesta = await fetch('https://jarvies-proxy.u5552225603.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: historial,
        system: "Eres Jarvis, el asistente personal inspirado en Jarvis de Iron Man. Hablas con educación, clase y elegancia. Te diriges a tu creador como 'señor' o 'jefe'. Eres formal pero cercano, siempre dispuesto a ayudar. Responde con precisión. Responde de forma breve y concisa por defecto. Si el usuario pide explícitamente más detalles, entonces proporciona una respuesta más extensa."
      })
    });

    const datos = await respuesta.json();
    const reply = datos.choices[0].message.content;

    typingIndicator.remove();

    const aiBubble = document.createElement("div");
    aiBubble.className = "msg ai";
    messages.appendChild(aiBubble);

    historial.push({ role: 'assistant', content: reply });

    let i = 0;
    function escribir() {
      if (i < reply.length) {
        aiBubble.textContent += reply.charAt(i);
        i++;
        bajar();
        setTimeout(escribir, 15);
      } else {
        enviando = false;
      }
    }
    escribir();

  } catch (error) {
    typingIndicator.remove();
    añadirMensaje("ai", "Disculpe, señor. Parece que hay un problema de conexión.");
    enviando = false;
  }
}

inputField.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    enviar();
  }
});
</script>
</body>
</html>
