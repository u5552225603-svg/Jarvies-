<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a12; color: white; margin: 0; padding: 20px; overflow: hidden; }
  #chat { max-width: 500px; margin: 0 auto; }
  h2 { text-align: center; color: #a78bfa; }
  .msg { padding: 12px 16px; border-radius: 15px; margin: 10px 0; max-width: 85%; line-height: 1.5; font-size: 15px; }
  .user { background: #4f46e5; margin-left: auto; text-align: right; }
  .ai { background: #1f1f2e; border: 1px solid #2a2a3e; }
  input { width: 100%; padding: 14px; border-radius: 25px; border: 1px solid #2a2a3e; background: #1f1f2e; color: white; margin-top: 10px; box-sizing: border-box; }
  button { width: 100%; padding: 14px; border-radius: 25px; border: none; background: #8b5cf6; color: white; margin-top: 8px; font-weight: bold; font-size: 15px; }
  button:active { background: #7c3aed; }

  /* --- BOLA AZUL DE JARVIS --- */
  #jarvis-orb {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb, #1e3a8a);
    box-shadow: 0 0 30px #3b82f6, 0 0 60px #2563eb, inset 0 0 20px #60a5fa;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 1000;
    pointer-events: none;
  }

  #jarvis-orb.active {
    opacity: 1;
    animation: pulse 1.5s infinite ease-in-out;
  }

  @keyframes pulse {
    0% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.2); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* --- PARTÍCULAS --- */
  .particle {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #60a5fa;
    box-shadow: 0 0 10px #3b82f6;
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    animation: floatUp 3s ease-out forwards;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    70% { opacity: 0.8; transform: translateY(-80px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-120px) scale(0.8); }
  }
</style>
</head>
<body>
<div id="chat">
  <h2>Jarvis</h2>
  <div id="messages"></div>
  <input id="input" placeholder="A sus órdenes, señor...">
  <button onclick="enviar()">Enviar</button>
</div>

<div id="jarvis-orb"></div>

<script>
const messages = document.getElementById("messages");
const orb = document.getElementById("jarvis-orb");
let historial = [];

async function enviar() {
  const input = document.getElementById("input");
  const texto = input.value.trim();
  if (!texto) return;

  messages.innerHTML += `<div class="msg user">${texto}</div>`;
  input.value = "";
  historial.push({ role: 'user', content: texto });

  try {
    const respuesta = await fetch('https://jarvies-proxy.u5552225603.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: historial,
        system: "Eres Jarvis, el asistente personal inspirado en Jarvis de Iron Man. Hablas con educación, clase y elegancia. Te diriges a tu creador como 'señor' o 'jefe'. Eres formal pero cercano, siempre dispuesto a ayudar. Responde con precisión."
      })
    });

    const datos = await respuesta.json();
    const reply = datos.choices[0].message.content;
    messages.innerHTML += `<div class="msg ai">${reply}</div>`;
    historial.push({ role: 'assistant', content: reply });

  } catch (error) {
    messages.innerHTML += `<div class="msg ai">Disculpe, señor. Parece que hay un problema de conexión.</div>`;
  }
}

// Función para activar la bola y las partículas (se usará luego con "Hey Jarvis")
function activarJarvis() {
  orb.classList.add('active');
  for (let i = 0; i < 12; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      const x = Math.random() * window.innerWidth;
      const y = window.innerHeight - 100 - Math.random() * 100;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3000);
    }, i * 150);
  }
  setTimeout(() => {
    orb.classList.remove('active');
  }, 4000);
}
</script>
</body>
</html>
