<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; }
  
  html, body { 
    height: 100%; 
    margin: 0; 
    padding: 0; 
    background: #0a0a12;
    color: white;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
  }

  body {
    display: flex; 
    flex-direction: column;
    overflow: hidden;
  }
  
  #main-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Dejamos un hueco abajo para que los mensajes no se escondan tras la barra */
    padding-bottom: 120px; 
  }

  #saludo {
    margin-top: 20vh; 
    text-align: center;
    font-size: 26px; 
    font-weight: 400;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    padding: 0 20px;
  }

  #messages {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .msg { 
    padding: 14px 20px; 
    border-radius: 20px; 
    max-width: 85%; 
    line-height: 1.6; 
    font-size: 16px;
    animation: fadeIn 0.3s ease-out;
  }
  .user { background: #1e3a8a; margin-left: auto; border-bottom-right-radius: 4px; }
  .ai { background: #1f1f2e; border: 1px solid #2a2a3e; margin-right: auto; border-bottom-left-radius: 4px; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* LA BARRA AHORA FLOTA Y TIENE MARGEN DE SEGURIDAD */
  #input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0a0a12;
    padding: 10px 15px;
    /* Aquí está el truco: 80px de margen inferior para saltarse los botones de Android */
    padding-bottom: 80px; 
    display: flex;
    justify-content: center;
    z-index: 100;
  }

  .input-wrapper {
    width: 100%;
    max-width: 700px;
    display: flex;
    background: #1f1f2e;
    border-radius: 30px;
    padding: 5px 5px 5px 20px;
    border: 1px solid #2a2a3e;
    align-items: center;
  }

  input { 
    flex: 1; 
    background: transparent;
    border: none; 
    color: white; 
    font-size: 16px;
    outline: none;
    padding: 10px 0;
  }

  button { 
    background: #3b82f6; 
    border: none; 
    border-radius: 50%; 
    width: 45px; 
    height: 45px; 
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: 10px;
    transition: 0.2s;
    flex-shrink: 0;
  }
  button:active { background: #2563eb; transform: scale(0.95); }
  button svg { width: 20px; height: 20px; fill: white; }

  .typing {
    display: flex;
    gap: 5px;
    padding: 10px 15px;
    background: #1f1f2e;
    border-radius: 20px;
    width: fit-content;
    margin-right: auto;
    border: 1px solid #2a2a3e;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: #60a5fa;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
</style>
</head>
<body>

<div id="main-area">
  <div id="saludo">Buenas tardes, señor.</div>
  <div id="messages" style="display: none;"></div>
</div>

<div id="input-area">
  <div class="input-wrapper">
    <input id="input" placeholder="Pregunta lo que necesites..." autocomplete="off">
    <button onclick="enviar()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const messages = document.getElementById("messages");
const saludo = document.getElementById("saludo");
const inputField = document.getElementById("input");
let historial = [];

// Saludo dinámico
function actualizarSaludo() {
  const hora = new Date().getHours();
  let texto = "Buenas noches, señor.";
  if (hora >= 6 && hora < 12) texto = "Buenos días, señor.";
  else if (hora >= 12 && hora < 20) texto = "Buenas tardes, señor.";
  saludo.innerText = texto; 
}
actualizarSaludo();

async function enviar() {
  const texto = inputField.value.trim();
  if (!texto) return;

  saludo.style.display = "none";
  messages.style.display = "flex";

  messages.innerHTML += `<div class="msg user">${texto}</div>`;
  inputField.value = "";
  historial.push({ role: 'user', content: texto });

  const mainArea = document.getElementById("main-area");
  mainArea.scrollTop = mainArea.scrollHeight;

  const typingIndicator = document.createElement("div");
  typingIndicator.className = "typing";
  typingIndicator.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
  messages.appendChild(typingIndicator);
  mainArea.scrollTop = mainArea.scrollHeight;

  try {
    const respuesta = await fetch('https://jarvies-proxy.u5552225603.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: historial,
        system: "Eres Jarvis, el asistente personal inspirado en Jarvis de Iron Man. Hablas con educación, clase y elegancia. Te diriges a tu creador como 'señor' o 'jefe'. Eres formal pero cercano, siempre dispuesto a ayudar. Responde con precisión. Responde de forma breve y concisa por defecto. Si el usuario pide explícitamente más detalles, entonces proporciona una respuesta más extensa."
      })
    });

    const datos = await respuesta.json();
    const reply = datos.choices[0].message.content;
    
    typingIndicator.remove();

    const aiBubble = document.createElement("div");
    aiBubble.className = "msg ai";
    messages.appendChild(aiBubble);

    let i = 0;
    function escribir() {
      if (i < reply.length) {
        aiBubble.innerHTML += reply.charAt(i);
        i++;
        mainArea.scrollTop = mainArea.scrollHeight;
        setTimeout(escribir, 15); 
      }
    }
    escribir();

    historial.push({ role: 'assistant', content: reply });

  } catch (error) {
    typingIndicator.remove();
    messages.innerHTML += `<div class="msg ai">Disculpe, señor. Parece que hay un problema de conexión.</div>`;
    mainArea.scrollTop = mainArea.scrollHeight;
  }
}

inputField.addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    enviar();
  }
});
</script>
</body>
</html>
