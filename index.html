<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Javier</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a12; color: white; margin: 0; padding: 20px; }
  #chat { max-width: 500px; margin: 0 auto; }
  h2 { text-align: center; color: #a78bfa; }
  .msg { padding: 12px 16px; border-radius: 15px; margin: 10px 0; max-width: 85%; line-height: 1.4; }
  .user { background: #4f46e5; margin-left: auto; text-align: right; }
  .ai { background: #1f1f2e; border: 1px solid #2a2a3e; }
  input { width: 100%; padding: 14px; border-radius: 25px; border: 1px solid #2a2a3e; background: #1f1f2e; color: white; margin-top: 10px; box-sizing: border-box; }
  button { width: 100%; padding: 14px; border-radius: 25px; border: none; background: #8b5cf6; color: white; margin-top: 8px; font-weight: bold; font-size: 15px; }
  button:active { background: #7c3aed; }
</style>
</head>
<body>
<div id="chat">
  <h2>Javier</h2>
  <div id="messages"></div>
  <input id="input" placeholder="A sus órdenes, señor...">
  <button onclick="enviar()">Enviar</button>
</div>

<script>
const API_KEY = "AQ.Ab8RN6Ij1dwiV32S7bt0bUf06FmXUBOs3Ry1yJMTjVeqVHLqpg";
const messages = document.getElementById("messages");

async function enviar() {
  const input = document.getElementById("input");
  const texto = input.value.trim();
  if (!texto) return;

  messages.innerHTML += `<div class="msg user">${texto}</div>`;
  input.value = "";

  try {
    const respuesta = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + API_KEY, {
      method: 'POST',
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        contents: [{
          parts: [{ text: "Eres Javier, el asistente personal inspirado en Jarvis de Iron Man. Hablas con educación, clase y elegancia. Te diriges a tu creador como 'señor' o 'jefe'. Eres formal pero cercano, siempre dispuesto a ayudar. Responde con precisión. El usuario dice: " + texto }]
        }]
      })
    });

    const datos = await respuesta.json();
    const reply = datos.candidates[0].content.parts[0].text;
    messages.innerHTML += `<div class="msg ai">${reply}</div>`;
  } catch (error) {
    messages.innerHTML += `<div class="msg ai">Disculpe, señor. Parece que hay un problema de conexión.</div>`;
  }
}
</script>
</body>
</html>
